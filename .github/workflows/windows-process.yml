name: Windows process ownership

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-process:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install project-local test environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install ".[dev]"
      - name: Verify Windows Job ownership and isolated test execution
        run: >-
          .venv/Scripts/python -B scripts/run-pytest.py -p no:cacheprovider
          tests/test_process.py tests/test_process_integration.py
          tests/test_process_diagnostic_windows.py
          tests/test_git_environment.py tests/test_pytest_source_entry.py
          tests/test_merge_paths.py
          tests/test_pytest_source.py tests/test_executable_fixture.py
          tests/test_build_distributions.py
          tests/test_dependency_audit_npm.py
