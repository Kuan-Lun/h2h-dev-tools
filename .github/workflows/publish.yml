name: Publish to PyPI

on:
  push:
    paths:
      - src/h2h_dev_tools/process.py
      - src/h2h_dev_tools/_process_diagnostic.py
      - src/h2h_dev_tools/_process_scope.py
      - src/h2h_dev_tools/git_environment.py
      - src/h2h_dev_tools/merge_admission.py
      - src/h2h_dev_tools/source_loader.py
      - src/h2h_dev_tools/pytest_source.py
      - src/h2h_dev_tools/executable_fixture.py
      - src/h2h_dev_tools/dependency_audit.py
      - scripts/run-pytest.py
      - scripts/with-git-environment.py
      - scripts/build-and-verify-distributions.py
      - tests/test_process*.py
      - tests/test_git_environment.py
      - tests/test_merge_paths.py
      - tests/test_pytest_source_entry.py
      - tests/test_pytest_source.py
      - tests/test_executable_fixture.py
      - tests/test_dependency_audit_npm.py
      - tests/test_build_distributions.py
      - pyproject.toml
      - .github/workflows/windows-process.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact project version to publish, including the first release
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-checks:
    uses: ./.github/workflows/windows-process.yml

  validate:
    if: >-
      ${{ github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install declared build dependencies
        run: |
          python scripts/install-ci-dependencies.py packaging build hatchling
      - name: Select explicitly requested version or push transition
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/select-publish-version.py
      - name: Build and verify distributions
        if: steps.version.outputs.publish == 'true'
        run: >-
          python scripts/build-and-verify-distributions.py
          --output-directory dist
      - name: Store distributions
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [validate, windows-checks]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
